[[left_out]]
name = "FreePats instruments published only as 7z or tar archives"
from = "https://freepats.zenvoid.org/"
reason = "form"
says = "Eleven CC0 instruments of the FreePats project have no repository to fetch a pinned version from, only archives in forms Trill does not unpack (7z, tar.xz, tar.bz2): Xylophone, Concert Harp, Tenor Saxophone, Clarinet, Wooden Recorder, Kalimba, Jaw Harp, Church Organ Emulation, Drawbar Organ Emulation, Percussive Organ Emulation and Rock Organ Emulation. Their licence passes (\"Published under the terms of the Creative Commons CC0 1.0 public domain dedication.\"); only the fetching is missing."

