[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[workspace.dependencies]
trill-assistant = { path = "crates/trill-assistant" }
trill-core = { path = "crates/trill-core" }
trill-dsp = { path = "crates/trill-dsp" }
trill-engine = { path = "crates/trill-engine" }
trill-library = { path = "crates/trill-library" }
trill-plugins = { path = "crates/trill-plugins" }
trill-runtime = { path = "crates/trill-runtime" }
trill-mcp = { path = "crates/trill-mcp" }
trill-media = { path = "crates/trill-media" }
trill-noir = { path = "crates/trill-noir" }

anyhow = "1"
base64 = "0.22"
cpal = "0.18"
hound = "3.5"
log = "0.4"
parking_lot = "0.12"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Audio DSP is unusable at opt-level 0, so even dev builds are optimized.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
