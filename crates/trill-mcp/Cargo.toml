[package]
name = "trill-mcp"
description = "Model Context Protocol server: lets AI agents drive the DAW"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trill-mcp"
path = "src/main.rs"

[dependencies]
trill-core.workspace = true
trill-dsp.workspace = true
trill-engine.workspace = true
trill-catalogue.workspace = true
trill-fetch.workspace = true
trill-library.workspace = true
trill-listen.workspace = true
trill-plugins.workspace = true
trill-runtime.workspace = true
trill-stage.workspace = true
trill-study.workspace = true
trill-theory.workspace = true
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
log.workspace = true
rmcp = { version = "3.10", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-std"] }
tokio-util = "0.7"

[dev-dependencies]
# Without rmcp's "reqwest" feature, which adds TLS (and a C crypto library
# that takes minutes to build): the tests only talk to localhost.
rmcp = { version = "3.10", features = ["client", "transport-streamable-http-client-reqwest"] }
# Fixtures: sample folders and settings in temporary places, audio written to them.
tempfile = "3"
trill-media.workspace = true
# The one test that drives a real, installed plugin through the tools.
trill-plugins.workspace = true
