[package]
name = "trill-together"
description = "The wire between programs that hold the same song: invitations, encrypted connections and what is said over them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trill-core.workspace = true
# The connection only holders of a secret can use (the Noise protocol,
# through the `snow` library: no cipher is written here or there), and
# the half of a meeting point that a Trill speaks. The crate has nothing
# of Trill in it: it is also what a keeper builds for a server.
trill-meet.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# The secret of an invitation, from the system's own source. In the tree
# already, through snow and others.
getrandom = "0.3"
# The key an invitation's secret comes to. In the tree already, through
# trill-fetch.
sha2 = "0.11"
