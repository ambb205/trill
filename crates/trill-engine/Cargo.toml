[package]
name = "trill-engine"
description = "Realtime audio engine, offline renderer and the session that drives them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trill-core.workspace = true
trill-dsp.workspace = true
trill-media.workspace = true
cpal.workspace = true
log.workspace = true
parking_lot.workspace = true
rtrb.workspace = true
serde.workspace = true
# What crosses to a process that renders for this one, and back.
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
# For taking an output device exclusively (WASAPI), which the audio library
# does not offer. The same crate and version it brings in itself.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    # How much memory the process holds: plugins that load samples show in it.
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    # How much of its processor a thread has had, for telling a block that
    # took long to compute from a thread the system held up.
    "Win32_System_WindowsProgramming",
    # For a process that renders for another: how much memory the machine
    # has left before one is started, and, in it, which module a fault was
    # in, said on its way down.
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[dev-dependencies]
# Fixtures for the audio tests: temporary folders and files.
tempfile = "3"
