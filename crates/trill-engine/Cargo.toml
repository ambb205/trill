[package]
name = "trill-engine"
description = "Realtime audio engine, offline renderer and the session that drives them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trill-core.workspace = true
trill-dsp.workspace = true
trill-media.workspace = true
cpal.workspace = true
log.workspace = true
parking_lot.workspace = true
rtrb.workspace = true
serde.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Devices_FunctionDiscovery",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# Fixtures for the audio tests: temporary folders and files.
tempfile = "3"
