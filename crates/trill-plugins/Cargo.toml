[package]
name = "trill-plugins"
description = "Hosting for third-party audio plugins (CLAP and VST3)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
trill-core.workspace = true
clack-host = "0.2.0"
# The CLAP structs themselves, which clack is built on (so this builds
# nothing more): a plugin's input buffers are filled in by hand, because
# clack 0.2 writes a port's constant mask by the port's place among the
# ports and not by its channels.
clap-sys = "0.5.0"
clack-extensions = { version = "0.2.0", features = [
    "clack-host",
    "audio-ports",
    "latency",
    "log",
    "note-ports",
    "gui",
    "params",
    "preset-discovery",
    "render",
    "state",
    "thread-check",
    "timer",
] }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
# Bindings to the VST 3 API, generated from the SDK headers. They ship
# inside the crate, so building needs no copy of the SDK.
vst3 = "0.3.0"
# Loads VST3 modules. (clack loads CLAP libraries with it too.)
libloading = "0.8"
# For the presets vendors keep in files of their own: Serum 2's are
# zstd-compressed, and its states carry the MD5 of their compressed body.
# Both are small and written in Rust alone: no C compiler, no further
# dependencies (ruzstd's checksum support is left out).
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
md5 = "0.8"

# The plugin main thread runs a Win32 message loop and hosts the windows
# of plugin editors, the scanner process turns off crash dialogs, and VST3
# preset files are looked for in the user's documents, wherever those are.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# On macOS the windows of plugin editors are AppKit's, made and used on the
# first thread. The versions are the ones the tree has already (eframe's
# audio and graphics bring them), with only what is used of them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSRunLoop",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
] }

[dev-dependencies]
trill-dsp.workspace = true
trill-engine.workspace = true
# The unit tests host plugins of their own, written with clack and compiled
# into the test binary, to check the host exactly and against misbehavior.
clack-plugin = "0.2.0"
clack-extensions = { version = "0.2.0", features = ["clack-plugin"] }
# The `editor` example saves pictures of the editors it opens.
png = "0.18"

# Owns its first thread, which on macOS it lends to the plugins: libtest's
# harness would run its tests on threads of its own.
[[test]]
name = "first_thread"
harness = false

# Owns its first thread and runs a loop there, as a window does, with the
# plugins served from it (macOS).
[[test]]
name = "first_thread_window"
harness = false
