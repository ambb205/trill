[package]
name = "trill-app"
description = "The Trill application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "trill"
path = "src/main.rs"

[dependencies]
trill-assistant.workspace = true
trill-core.workspace = true
trill-dsp.workspace = true
trill-engine.workspace = true
trill-catalogue.workspace = true
trill-fetch.workspace = true
trill-library.workspace = true
trill-mcp.workspace = true
trill-media.workspace = true
trill-noir.workspace = true
trill-plugins.workspace = true
trill-runtime.workspace = true
trill-stage.workspace = true
trill-listen.workspace = true
trill-study.workspace = true
trill-update.workspace = true

anyhow.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true

eframe = "0.37"
# Native open/save dialogs. They are awaited on a helper thread (see
# `ui::files`), which is what `pollster` is for.
rfd = "0.18"
pollster = "1"
# Encodes `--screenshot` output.
image = { version = "0.25", default-features = false, features = ["png"] }
# Names the window's own handle, which plugin editors are given as their
# owner. The version eframe itself is built on.
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
# What a window that is only there to have its picture taken is to macOS: a
# program that is never brought to the front. The version eframe itself is
# built on.
winit = { version = "0.30", default-features = false }

[dev-dependencies]
# Sample packs for the interaction tests, away from the user's own.
tempfile = "3"
# A meeting point on the loopback, for the test of sharing through one.
trill-meet.workspace = true

[build-dependencies]
# Embeds the icon in the Windows executable.
winresource = "0.1"
